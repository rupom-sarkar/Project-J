<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS — Living Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="hud">
    <canvas id="neuralCanvas" aria-hidden="true"></canvas>
    <div class="vignette"></div>
    <div class="scanlines"></div>

    <header class="topbar">
      <div class="brand">
        <div class="reactor">
          <span></span><i></i>
        </div>
        <div>
          <div class="brand-name">JARVIS</div>
          <div class="status"><b></b> ACTIVE</div>
        </div>
      </div>

      <div class="online-panel">
        <span class="status-dot"></span>
        <div>
          <small>AI ASSISTANT</small>
          <strong>ONLINE</strong>
        </div>
      </div>
    </header>

    <section class="brain-stage">
      <div class="energy-ring ring-a"></div>
      <div class="energy-ring ring-b"></div>
      <div class="energy-ring ring-c"></div>

      <div class="brain-core">
        <div class="core-aura"></div>
        <div class="core-grid"></div>
        <div class="core-label">JARVIS</div>
        <div class="core-sub">NEURAL CORE</div>
      </div>

      <div class="signal s1"></div>
      <div class="signal s2"></div>
      <div class="signal s3"></div>
      <div class="signal s4"></div>
    </section>

    <aside class="activity-panel">
      <div class="wave">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <div class="activity-copy">
        <div><b id="listenState">LISTENING...</b></div>
        <div id="processState">PROCESSING...</div>
        <div id="respondState">RESPONDING...</div>
      </div>
    </aside>

    <button class="command" id="commandBtn" type="button">
      <span class="command-icon">◉</span>
      <span>COMMAND</span>
      <span class="arrow">›</span>
    </button>

    <div class="bottom-label">
      <span></span>
      LIVING INTELLIGENCE
      <span></span>
    </div>

    <div class="command-console" id="console">
      <div class="console-head">
        <span>JARVIS COMMAND INTERFACE</span>
        <button id="closeConsole" type="button">×</button>
      </div>
      <div class="console-body">
        <div class="terminal-line"><span>&gt;</span> Neural core ready.</div>
        <div class="terminal-line"><span>&gt;</span> Awaiting command...</div>
        <div class="input-row">
          <input id="commandInput" autocomplete="off" placeholder="Enter a command..." />
          <button id="sendCommand" type="button">SEND</button>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
